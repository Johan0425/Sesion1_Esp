resources:
  jobs:
    trabajo_final_vuelos:
      name: Trabajo_Final_Vuelos
      tasks:
        - task_key: Bronze_Ingestion
          description: Lee los CSV, tipa, elimina nulos obligatorios y escribe aerolinea_tf.bronze
          disabled: false
          email_notifications: {}
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          run_if: ALL_SUCCESS
          spark_python_task:
            python_file: /Workspace/Users/joanpe.dev@gmail.com/Sesion1_Esp/Entrega_Final/pipeline/bronze_ingestion.py
            source: WORKSPACE
          timeout_seconds: 1200
        - task_key: Silver_Transform
          depends_on:
            - task_key: Bronze_Ingestion
          description: Lee Bronze, enriquece y valida, y escribe aerolinea_tf.silver
          disabled: false
          email_notifications: {}
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          run_if: ALL_SUCCESS
          spark_python_task:
            python_file: /Workspace/Users/joanpe.dev@gmail.com/Sesion1_Esp/Entrega_Final/pipeline/silver_transform.py
            source: WORKSPACE
          timeout_seconds: 1200
        - task_key: Gold_Analytics
          depends_on:
            - task_key: Silver_Transform
          description: Lee Silver, publica los KPI en aerolinea_tf.gold, optimiza y reconcilia
          disabled: false
          email_notifications: {}
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          run_if: ALL_SUCCESS
          spark_python_task:
            python_file: /Workspace/Users/joanpe.dev@gmail.com/Sesion1_Esp/Entrega_Final/pipeline/gold_analytics.py
            source: WORKSPACE
          timeout_seconds: 1200
      description: 'Pipeline medallón de vuelos: lee los CSV del volumen aerolinea_tf.fuentes.landing, publica Bronze, Silver y Gold en el catálogo aerolinea_tf y optimiza las tablas Gold.'
      email_notifications:
        on_failure:
          - joanpe.dev@gmail.com
        on_success:
          - joanpe.dev@gmail.com
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      max_concurrent_runs: 1
      notification_settings:
        no_alert_for_canceled_runs: true
        no_alert_for_skipped_runs: true
      queue:
        enabled: true
      schedule:
        pause_status: UNPAUSED
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/Bogota
      timeout_seconds: 3600
      webhook_notifications: {}
